# pyproject.toml
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "verl"
version = "0.1.0"
description = "veRL: Volcano Engine Reinforcement Learning for LLM"
license = "Apache-2.0"
readme = "README.md"
authors = [
    "Bytedance - Seed - MLSys <zhangchi.usc1992@bytedance.com>",
    "Bytedance - Seed - MLSys <gmsheng@connect.hku.hk>"
]
repository = "https://github.com/volcengine/verl"
homepage = "https://github.com/volcengine/verl"

# Package discovery – include your package directory.
packages = [
    { include = "verl" },
    { include = "pretraining_analysis" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
#accelerate = "*"
codetiming = "*"
datasets = "*"
dill = "*"
#hydra-core = "*"
# Use newer numpy version compatible with Python 3.12
numpy = ">=1.26.0"
pybind11 = "*"
#ray = "*"
tensordict = "*"
transformers = "<4.48"
#vllm = "<=0.6.3"
pandas = "*"
tqdm = "*"
nltk = "^3.9.1"
datasketch = "*"
pyyaml = "*"
marvin = "^2.3.8"
loguru = "^0.7.3"
hf-transfer = "^0.1.9"
pyarrow = "^19.0.1"
psutil = "^7.0.0"
spacy = "^3.8.4"

[tool.poetry.group.dev.dependencies]
pytest = "*"
yapf = "*"
pre-commit = "*"
black = "*"
isort = "*"
flake8 = "*"
mypy = "*"

[tool.poetry.scripts]
verl = "verl.main:main"

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
